#cloud-config
users:
  - name: gigi
    gecos: LuigiNix Admin
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh-authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBkq//P4prSN4rgyjTGbx6Ufk0a34UuT+63g3wtl9E3g gigi@SEVEN

network:
  version: 2
  ethernets:
    eth0:
      dhcp4: false
      addresses: [10.9.9.2/24]
      gateway4: 10.9.9.1
      nameservers:
        addresses: [1.1.1.1]

bootcmd:
  - [ bash, -lc, 'set -eux
      # bring up network (cloud-init network config may not have applied yet)
      ip link set eth0 up
      ip addr add 10.9.9.2/24 dev eth0
      ip route add default via 10.9.9.1
      sleep 2
      # verify connectivity
      ping -c 1 10.9.9.1 || true
      # clone repo
      rm -rf /root/nixos-pmox-installer
      git clone https://github.com/grimmo/nixos-pmox-installer.git /root/nixos-pmox-installer
      cd /root/nixos-pmox-installer
      # install
      nixos-install --no-root-passwd --flake flake.nix || (sleep 5 && nixos-install --no-root-passwd --flake flake.nix) || true
    ' ]

runcmd:
  - [ bash, -lc, 'sync' ]
