#cloud-config

# Static network configuration for the primary interface. Change the interface
# name (eth0) below if your VM uses a different device name (e.g. ens3).
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: false
      addresses: [10.9.9.2/24]
      gateway4: 10.9.9.1
      nameservers:
        addresses: [1.1.1.1]

users:
  - name: gigi
    gecos: Luigi
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh-authorized-keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBkq//P4prSN4rgyjTGbx6Ufk0a34UuT+63g3wtl9E3g gigi@SEVEN

# bootcmd runs early in the installer environment; it clones the flake and runs nixos-install
# waits a bit for network then clones this repository and installs the flake configuration
bootcmd:
  - [ bash, -lc, 'set -eux
      # wait for network
      for i in $(seq 1 12); do
        if ip -4 addr show scope global | grep -q inet; then break; fi
        sleep 5
      done
      # clone the repo containing the flake (this repo)
      rm -rf /root/nixos-pmox-installer
      git clone https://github.com/grimmo/nixos-pmox-installer.git /root/nixos-pmox-installer
      cd /root/nixos-pmox-installer
      # Install using the flake (target name: #proxmox-vm). Retry once on failure.
      nixos-install --no-root-passwd --flake flake.nix || (sleep 5 && nixos-install --no-root-passwd --flake flake.nix) || true
    ' ]

runcmd:
  - [ bash, -lc, 'sync' ]
